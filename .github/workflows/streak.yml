name: Daily Streak Keeper

on:
  schedule:
    # Runs daily at 00:00 UTC (05:30 IST)
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update streak keepalive
        run: |
          mkdir -p .github
          echo "streak: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > .github/keepalive

      - name: Commit and push
        run: |
          git config user.name "Daksh-create349"
          git config user.email "dakshshrivastav56@gmail.com"
          git add .github/keepalive
          git commit -m "chore(streak): daily keepalive [skip ci]"
          git pull --rebase origin main
          git push origin main
